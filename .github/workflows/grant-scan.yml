name: Grant scan

on:
  schedule:
    # Wakes every Monday at 11:00 UTC (6:00 AM Central Standard / 5:00 AM daylight time);
    # the "gate" job lets it continue only every other week. GitHub may start a few minutes late.
    - cron: "0 11 * * 1"
  workflow_dispatch:      # "Run workflow" button on the Actions tab - always runs
    inputs:
      max_areas:
        description: "Limit AI search areas (blank = all; use 1 for a cheap test)"
        required: false
        default: ""

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: grant-scan
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        run: |
          # Weeks since 1970 - even weeks run, odd weeks skip (steady 14-day rhythm, no year-end hiccup).
          week=$(( $(date -u +%s) / 604800 ))
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ $(( week % 2 )) -eq 0 ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "Scanning this week."
          else
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "Off week - skipping."
          fi

  scan:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scanner/requirements.txt

      - run: pip install -r scanner/requirements.txt

      - name: Scan for opportunities
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          OLD_DASHBOARD_PASSWORD: ${{ secrets.OLD_DASHBOARD_PASSWORD }}
          GH_DATA_TOKEN: ${{ secrets.GH_DATA_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SCAN_MAX_AREAS: ${{ inputs.max_areas }}
        run: python scanner/scan.py

      - name: Commit results
        run: |
          git config user.name "grant-scan-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f docs/data
          if git diff --cached --quiet; then
            echo "No changes"; exit 0
          fi
          git commit -m "Grant scan $(date -u +%Y-%m-%d)"
          # Someone may have saved a decision while the scan ran
          for i in 1 2 3; do
            git pull --rebase origin "${GITHUB_REF_NAME}" && git push && exit 0
            sleep 5
          done
          exit 1

  deploy:
    needs: scan
    uses: ./.github/workflows/pages.yml
